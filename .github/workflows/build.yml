name: Build EXE
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1
      - name: Compile EXE
        run: csc /target:winexe /out:DominantExecutor.exe Ejecutor.cs
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: Dominant-App
          path: DominantExecutor.exe
